<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting Text</title>
</head>

<body>
    
    <p>only <b>this</b> is bold</p>
    <p>This is <strong>important</strong> text.</p>

    <p>only <u>this</u> is underlined </p>

    <p>only <s>this</s> is striked </p>
    <p>only <del>this</del> is striked </p>

    <p>H<sub>2</sub>O</p>
    <p>2<sup>n</sup> = 4<sup>1/2</sup></p>

    <p>This is <em>emphasized</em> text.</p>
    <p>this is <i>Italic text</i></p>

    <p>this is both <i><b>Italic and Bold</b></i> text</p>

    <p> </p>
</body>

</html>
