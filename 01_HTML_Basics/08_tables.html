<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="5">
        <tr>
            <th>s.no</th>
            <th>Item</th>
            <th>price</th>
        </tr>

        <tr>
            <td>1</td>
            <td>tomato</td>
            <td>$1.99</td>
        </tr>

        <tr>
            <td>2</td>
            <td>watermelon</td>
            <td>$3.99</td>
        </tr>

        <tr>
            <td>3</td>
            <!-- takes 2 space  -->
            <td colspan="2" >c apple</td>
            <td>$2.99</td>
        </tr>

    </table>

</html>
