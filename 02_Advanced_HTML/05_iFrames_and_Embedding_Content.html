<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes & Video embedding</title>
</head>
<body>
    <h1>
        This is iframe
    </h1>

    <p>
        1.) A wikipedia
    </p>

    <iframe src="https://www.wikipedia.com" width="650" height="550" frameborder="0"></iframe>

    <p>
        2.) A Youtube Video
    </p>

    <iframe width="660" height="385" src="https://www.youtube.com/embed/xb-fcoMMiTM?si=rLdqpddWl8hXzRW1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <p>
        3.) Maps
    </p>

   <iframe
    height="550"
    width="650"
    src="https://www.openstreetmap.org/export/embed.html?bbox=77.1025%2C28.7041%2C77.3025%2C28.8041&layer=mapnik"
    allowfullscreen
    loading="lazy">
  </iframe>

</body>

</html>
