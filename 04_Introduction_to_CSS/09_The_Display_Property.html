<!DOCTYPE html>

    <title>Display Property</title>
    <link rel="stylesheet" href="style9.css">
</head>
<body>
    <div>
        This is a Block Element
    </div>

    <span>
        This is a inline element
    </span>

    <span>

        Box 1
