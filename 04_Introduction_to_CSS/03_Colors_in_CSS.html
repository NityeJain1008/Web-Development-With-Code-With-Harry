<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        body{
            background-color: rgb(122, 192, 197);
        }
        p{
            color: rgb(255, 255, 0);
        }
        .big{
            font-size: 40px;
        }
        h1{
            color: rgba(255, 0, 0, 0.5);
        }
        h2 {
            color: hsl(240, 100%, 50%);
        }


    </style>
</head>
<body>
    <p class="big">
        Hello
    </p>
    <h1>
        These are colors with 0.5 opacity
    </h1>
    <h2>
        This is HSL
    </h2>
</body>
</html>
