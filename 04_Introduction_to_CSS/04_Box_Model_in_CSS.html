
<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .box {
            width: 400px;

            padding: 20px;
            border: 10px solid;
            margin: 40px;
            box-sizing: border-box;

</head>

<body>

</body>
